name: Daily Qatar business news and market prices
on:
  schedule:
    - cron: '15 3,7,11,15 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: news
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/news.mjs
      - run: node scripts/markets.mjs
      - name: Commit if changed
        run: |
          git config user.name "basira-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || (git commit -m "تحديث أخبار الأعمال وأسعار السوق" && git pull --rebase -q && git push)
