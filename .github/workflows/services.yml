name: Service pages
on:
  schedule:
    - cron: '40 2 * * *'
  push:
    branches: [main]
    paths: ['assets/data.js', 'assets/details.js', 'assets/catalog.js', 'scripts/services.mjs']
  workflow_dispatch:
permissions:
  contents: write
concurrency: services
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/services.mjs
      - name: Commit if changed
        run: |
          git config user.name "basira-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add services en/services sitemap.xml
          git diff --cached --quiet || (git commit -m "تحديث صفحات الخدمات من القائمة المعتمدة في لوحة الإدارة" && git pull --rebase -q && git push)
